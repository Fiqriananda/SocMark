<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Jelajahi posting dari komunitas SocMark — temukan barang menarik, suka dan tinggalkan komentar.">
    <title>Feed | SocMark</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="feed-page-body">
    <!-- Top Navigation Bar -->
    <header class="app-navbar">
        <nav>
            <a href="feed.html" class="app-nav-brand">
                <div class="brand-logo-small">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="18" x="3" y="3" rx="5"/>
                        <circle cx="8.5" cy="9.5" r="1.5" fill="currentColor"/>
                        <circle cx="15.5" cy="9.5" r="1.5" fill="currentColor"/>
                        <path d="M8.5 14.5c1 1.5 2.5 2 3.5 2s2.5-.5 3.5-2"/>
                    </svg>
                </div>
                <span>SocMark</span>
            </a>
            <ul class="app-nav-links">
                <li><a href="feed.html" class="active">Feed</a></li>
                <li><a href="discover.html">Discover</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="login.html">Sign In</a></li>
                <li><a href="register.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main class="product-page">
        <div class="product-page-heading">
            <div class="feed-header-badge">
                <span class="feed-badge-pulse" aria-hidden="true"></span>
                <span>Komunitas & Tren Terkini</span>
            </div>
            <h1>Explore Community Feed</h1>
            <p class="feed-page-subtitle">Temukan inspirasi produk pilihan, koleksi kurasi, dan interaksi langsung dengan kreator di SocMark.</p>
        </div>

        <!-- Filter Pill Bar -->
        <div class="feed-filter-bar" id="feed-filter-bar" role="tablist" aria-label="Filter kategori">
            <button class="feed-filter-pill active" data-category="all" role="tab" aria-selected="true">Semua</button>
        </div>

        <!-- Masonry Grid -->
        <section id="product-container" class="product-container" aria-live="polite" aria-busy="true">
            <p class="product-state">Memuat posting…</p>
        </section>
    </main>

    <!-- Post Detail Modal -->
    <div class="product-modal-overlay" id="product-modal-overlay" role="dialog" aria-modal="true"
        aria-label="Detail posting" hidden>
        <div class="product-modal-card" id="product-modal-card">
            <button class="product-modal-close" id="product-modal-close" aria-label="Tutup detail posting">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
            <div class="product-modal-inner" id="product-modal-inner"></div>
        </div>
    </div>

    <!-- App Footer -->
    <footer class="app-footer">
        <p>© 2026 SocMark. The Social Marketplace for Creators and Curators.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
